<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b4a"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- illustration : facture stylisée, à droite, inclinée -->
  <g transform="translate(815 150) rotate(-5)">
    <rect x="0" y="0" width="330" height="360" rx="12" fill="#ffffff"/>
    <rect x="30" y="38" width="165" height="18" rx="3" fill="#1c2b4a"/>
    <rect x="30" y="68" width="104" height="10" rx="3" fill="#c9cedd"/>
    <rect x="222" y="34" width="78" height="12" rx="3" fill="#bf3b1f"/>
    <rect x="30" y="132" width="270" height="9" rx="3" fill="#e9e4d6"/>
    <rect x="30" y="162" width="270" height="9" rx="3" fill="#e9e4d6"/>
    <rect x="30" y="192" width="270" height="9" rx="3" fill="#e9e4d6"/>
    <rect x="30" y="222" width="200" height="9" rx="3" fill="#e9e4d6"/>
    <rect x="132" y="280" width="168" height="44" rx="7" fill="#1c2b4a"/>
    <rect x="152" y="297" width="88" height="11" rx="3" fill="#f6f1e6"/>
    <circle cx="276" cy="302" r="7" fill="#bf3b1f"/>
  </g>

  <!-- monogramme F en pastille -->
  <g transform="translate(80 92)">
    <rect width="84" height="84" rx="18" fill="#0f1830"/>
    <g fill="#f6f1e6">
      <rect x="26" y="20" width="13" height="46" rx="2"/>
      <rect x="26" y="20" width="34" height="13" rx="2"/>
      <rect x="26" y="40" width="26" height="11" rx="2"/>
    </g>
    <circle cx="58" cy="60" r="7" fill="#bf3b1f"/>
  </g>

  <!-- bloc texte -->
  <text x="80" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="bold" fill="#f6f1e6">Facture<tspan fill="#bf3b1f" font-style="italic">Libre</tspan><tspan fill="#bf3b1f">.</tspan></text>
  <text x="84" y="356" font-family="Georgia, serif" font-size="40" fill="#f6f1e6">La facture conforme des</text>
  <text x="84" y="406" font-family="Georgia, serif" font-size="40" fill="#f6f1e6">micro-entrepreneurs.</text>
  <text x="84" y="460" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#cdd3e4">Gratuit &#183; sans inscription &#183; 100&#160;% dans votre navigateur</text>

  <rect x="84" y="500" width="470" height="50" rx="25" fill="none" stroke="#f6f1e6" stroke-opacity="0.45" stroke-width="1.6"/>
  <circle cx="112" cy="525" r="6" fill="#bf3b1f"/>
  <text x="130" y="534" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#f6f1e6">gwada9714.github.io/facture-libre</text>
</svg>
